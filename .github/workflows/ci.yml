name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make type
      - run: make test
      # the PR gate: every scenario in memory with the stand-in model, gated locally; needs no
      # Langfuse and no secrets, so it runs on fork PRs too. escalation-loop joins once its
      # outcome evaluator (escalation_loop) exists
      - name: Gate the scenario catalogue
        run: uv run python -m experiments.run --offline --skip escalation-loop --gate
