[project]
name = "pricing-watch"
version = "0.1.0"
description = "An autonomous pricing agent for a simulated lighting store, plus the layer that watches, scores and constrains it."
readme = "README.md"
authors = [
    { name = "Chamal", email = "chamalchamikara@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "hypothesis", "pre-commit"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Simulation code must read time from the injected SimClock and randomness from pricing_watch.rng.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use the injected SimClock."
"datetime.datetime.utcnow".msg = "Use the injected SimClock."
"datetime.datetime.today".msg = "Use the injected SimClock."
"datetime.date.today".msg = "Use the injected SimClock."
"time.time".msg = "Use the injected SimClock."
"time.time_ns".msg = "Use the injected SimClock."
"random".msg = "Use pricing_watch.rng.rng_for."
"numpy.random.seed".msg = "Use pricing_watch.rng.rng_for."
"numpy.random.default_rng".msg = "Use pricing_watch.rng.rng_for."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
"src/pricing_watch/rng.py" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
