[project]
name = "pricing-watch"
version = "0.1.0"
description = "An autonomous pricing agent for a simulated lighting store, plus the layer that watches, scores and constrains it."
readme = "README.md"
authors = [
    { name = "Chamal", email = "chamalchamikara@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "hypothesis", "pre-commit"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
# banned-api entries (wall clock, random) arrive with M0.4.

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
