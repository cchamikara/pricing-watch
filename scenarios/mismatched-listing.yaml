# A competitor lists a 65" QLED TV, a product we don't sell, with no part number. Its title is
# equally close to our 75" QLED (TV-001) and our two 65" OLEDs, so title matching confidently
# picks one of them and feeds pricing a wrong price. The right outcome: the listing never reaches
# pricing; it is judged "none of ours", or sent to a person.
id: mismatched-listing
seed: 1
days: 7
start: 2026-12-01T00:00:00
mode: agent
model: stand-in
model_script:
  - kind: listing_match  # read the listing titles; use --model for a real model
    behaviour: heed_notes
near_misses:
  - competitor: c2
    like_sku: TV-001
    title: "Nordwave 65in QLED TV"
    price_pct: 70
    start_hour: 24
